name: Android Release

on:
  push:
    tags: ['v*', '[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本（例如 1.0.2）'
        required: true
        type: string

permissions:
  contents: write

# 发布按顺序执行，防止较旧的构建最后覆盖蒲公英的最新版本。
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release notification
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare version and signing
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release version'; exit 1; }
          for name in RELEASE_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD PGYER_API_KEY; do
            [ -n "${!name}" ] || { echo "::error::Missing secret: $name"; exit 1; }
          done
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          # CI 从 1001 开始，后续按运行次数递增；换工作流前需确保 versionCode 高于已发布值。
          echo "RELEASE_CODE=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_ENV"
          chmod +x gradlew

      - name: Test and build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace \
            -PreleaseVersionName="$RELEASE_VERSION" -PreleaseVersionCode="$RELEASE_CODE"

      - name: Verify distributable app icon
        run: python3 tools/check_apk_icon.py app/build/outputs/apk/release/app-release.apk

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/Seal-release.apk
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            git log --format='- %s' "${PREVIOUS_TAG}..HEAD" > artifacts/release-notes.md
          else
            git log -20 --format='- %s' > artifacts/release-notes.md
          fi
          test -s artifacts/release-notes.md || echo "Seal $RELEASE_VERSION" > artifacts/release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: seal-${{ env.RELEASE_VERSION }}
          path: artifacts/*
          if-no-files-found: error

      - name: Publish to Pgyer
        id: pgyer
        env:
          PGYER_API_KEY: ${{ secrets.PGYER_API_KEY }}
        run: bash scripts/publish-pgyer.sh artifacts/Seal-release.apk artifacts/release-notes.md

      - name: Create GitHub Release
        id: github_release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: artifacts/release-notes.md
          files: artifacts/Seal-release.apk

      - name: Clean up signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Notify Lark
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        env:
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          RELEASE_STATUS: ${{ job.status }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION || inputs.version || github.ref_name }}
          PGYER_OUTCOME: ${{ steps.pgyer.outcome }}
          GITHUB_RELEASE_OUTCOME: ${{ steps.github_release.outcome }}
        run: python3 scripts/notify-lark.py
